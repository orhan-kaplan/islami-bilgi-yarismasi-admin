# Bu dosya, Dart kodunu statik olarak analiz eden analyzer'ı yapılandırır.
# Komut satırından `flutter analyze` ile çalıştırılır.
# Kural seti ana uygulama (islami-bilgi-yarismasi) ile hizalıdır.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Widget ağaçlarında gereksiz rebuild'i önler (dart fix --apply ile uyumlu).
    prefer_const_constructors: true
    prefer_const_declarations: true
    # Servis/provider metotlarının dönüş tipleri açık olsun.
    always_declare_return_types: true
    avoid_empty_else: true
